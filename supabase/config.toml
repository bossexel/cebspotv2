project_id = "cebspot-remediation-local"

[api]
enabled = true
port = 54351
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54352
shadow_port = 54350
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54353

[inbucket]
enabled = true
port = 54354

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["cebspot://auth/email-change", "cebspot://**", "http://localhost:8084/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"

[analytics]
enabled = false

[functions.paymongo-webhook]
verify_jwt = false

[functions.provision-owner-account]
verify_jwt = true

[functions.private-upload]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.payment-maintenance]
verify_jwt = false

[functions.private-upload-maintenance]
verify_jwt = false

[auth.email.template.recovery]
subject = "Your CebSpot password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your CebSpot email change"
content_path = "./supabase/templates/email-change.html"
