<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .frame {
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        overflow: hidden;
      }
      video {
        width: 100%;
        aspect-ratio: 9 / 16;
        object-fit: contain;
        display: block;
        background: #000;
      }
      .label {
        padding: 8px 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>screenrecgc.mp4 Review Frames</h1>
    <div class="grid" id="grid"></div>
    <script>
      const src = 'file:///C:/Users/9real/Downloads/screenrecgc.mp4';
      const targetFractions = [0.05, 0.18, 0.32, 0.48, 0.66, 0.84];
      const grid = document.getElementById('grid');

      function addFrame(index, time) {
        const frame = document.createElement('div');
        frame.className = 'frame';
        const video = document.createElement('video');
        video.src = src;
        video.muted = true;
        video.preload = 'auto';
        video.addEventListener('loadedmetadata', () => {
          video.currentTime = Math.min(Math.max(0.1, time(video.duration)), Math.max(0.1, video.duration - 0.1));
        });
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `Frame ${index + 1}`;
        frame.append(video, label);
        grid.appendChild(frame);
      }

      targetFractions.forEach((fraction, index) => addFrame(index, (duration) => duration * fraction));
    </script>
  </body>
</html>
